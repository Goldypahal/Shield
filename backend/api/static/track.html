<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>SHIELD live tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root { --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --muted: #64748B; --border: #E2E8F0; --sos: #DC2626; --ok: #16A34A; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0B111E; --card: #111A2A; --text: #E2E8F0; --muted: #94A3B8; --border: #233147; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
    h1 { font-size: 18px; margin: 0; }
    #status { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #fff; background: var(--sos); margin-right: 6px; }
    .pill.ok { background: var(--ok); }
    #map { flex: 1; min-height: 300px; }
    footer { padding: 12px 16px; background: var(--card); border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    footer a { color: var(--sos); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">SHIELD live tracking</h1>
    <p id="status">Loading…</p>
  </header>
  <div id="map" role="region" aria-label="Live location map"></div>
  <footer>
    If you believe they are in danger, <a href="tel:112">call 112</a>. This private link is read-only and expires after 24 hours. Updates every 10 seconds.
  </footer>
  <script src="/track-assets/track.js"></script>
</body>
</html>
