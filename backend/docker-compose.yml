# Local stack:  cd backend && cp .env.example .env && docker compose up --build
services:
  shield-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: shield-api
    env_file: .env
    environment:
      REDIS_URL: redis://shield-redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - shield-api-data:/data
    depends_on:
      shield-redis:
        condition: service_healthy
    restart: unless-stopped

  # Redis for pub/sub WebSocket multi-casting and token caching
  shield-redis:
    image: redis:7-alpine
    container_name: shield-redis
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - shield-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL with TimescaleDB + PostGIS for the planned migration off SQLite
  # (community buddy matching, contextual risk). Not used by the API yet:
  #   docker compose --profile postgis up
  shield-db:
    profiles: ["postgis"]
    image: timescale/timescaledb-ha:pg15-latest
    container_name: shield-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shield_db
      TS_TUNE_MEMORY: "1GB"
      TS_TUNE_NUM_CPUS: "2"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Schema files run automatically on first boot
      - ./db:/docker-entrypoint-initdb.d
      - shield-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shield_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shield-api-data:
  shield-redis-data:
  shield-pgdata:
